services:
  - type: web
    name: license-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: ADMIN_PASSWORD
        sync: false                  # imposta manualmente nella dashboard Render
      - key: DATABASE_URL
        fromDatabase:
          name: license-db
          property: connectionString  # Render inietta automaticamente postgres://...
    healthCheckPath: /health

databases:
  - name: license-db
    plan: free                       # PostgreSQL gratuito offerto da Render
