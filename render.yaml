services:
  - type: web
    name: tapesense-license-server
    env: python
    plan: starter
    buildCommand: pip install -r license_server/requirements.txt
    startCommand: gunicorn license_server.server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    disk:
      name: license-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LICENSE_DB_PATH
        value: /var/data/licenses.db
      - key: LICENSE_UPLOADS_DIR
        value: /var/data/uploads
      - key: LICENSE_KEY_PEPPER
        sync: false
      - key: LICENSE_SIGNING_PRIVATE_KEY_B64
        sync: false
      - key: LICENSE_SIGNING_KEY_ID
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: ENABLE_LEGACY_LICENSE_API
        value: "0"
      - key: ENABLE_LEGACY_ADMIN
        value: "0"
